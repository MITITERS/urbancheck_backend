volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  
  production_redis_data: {}
  


services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: urbancheck_production_django
    volumes:
      - production_django_media:/app/urbancheck/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: urbancheck_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
      # El rol de aplicación sin superusuario (N-07). Solo acá: el compose
      # local usa la misma imagen y no lo monta.
      - ./compose/production/postgres/init:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: urbancheck_production_traefik
    depends_on:
      - django
      - panel
    volumes:
      - production_traefik:/etc/traefik/acme
    environment:
      # El dominio de todo el despliegue (C-04): traefik.yml arma con él las
      # reglas de ruteo y los certificados. Sin valor, Compose no arranca.
      URBANCHECK_DOMAIN: ${URBANCHECK_DOMAIN:?Definí URBANCHECK_DOMAIN, por ejemplo urbancheck.com.ar}
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    # Sin root (N-18), con NET_BIND_SERVICE como única capacidad: alcanza
    # para el 80 y el 443. Sin no-new-privileges, que anularía la capacidad
    # que lleva el binario.
    user: '65532:65532'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  redis:
    image: docker.io/redis:7.2
    volumes:
      - production_redis_data:/data
    # Con contraseña (N-07). REDIS_PASSWORD va en .envs/.production/.redis, y
    # el REDIS_URL de .envs/.production/.django la lleva
    # (redis://:<contraseña>@redis:6379/0). Se vuelve a pasar por el
    # entrypoint de la imagen para que redis-server siga bajando al usuario
    # redis.
    env_file:
      - ./.envs/.production/.redis
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"

  celeryworker:
    <<: *django
    image: urbancheck_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: urbancheck_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: urbancheck_production_flower
    command: /start-flower
    # Solo en la interfaz local del servidor (C-06): se entra por túnel SSH,
    # `ssh -N -L 5555:127.0.0.1:5555 <usuario>@<servidor>`, y se abre
    # http://localhost:5555. Sigue pidiendo usuario y contraseña.
    ports:
      - '127.0.0.1:5555:5555'

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: urbancheck_production_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro

  # El panel municipal (C-04): el bundle de React servido por su nginx, que
  # también hace de proxy de /api, /_allauth, /media, /r y /.well-known a
  # Django. Se construye desde el repositorio del panel clonado al lado de este
  # (../urbanchech_frontend), en la versión que se quiera desplegar.
  panel:
    build:
      context: ../urbanchech_frontend
      target: runtime
    image: urbancheck_production_panel
    environment:
      API_UPSTREAM: http://django:5000
    depends_on:
      - django
