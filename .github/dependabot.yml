# Dependabot: actualizaciones semanales de dependencias (Sprint 5, punto 5.4).
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Python va por el ecosistema `uv` y no `pip`: es el que entiende `uv.lock` y lo
# regenera en el mismo PR. Con `pip`, Dependabot tocaría `pyproject.toml` y
# dejaría el lock desfasado.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      python:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/django/'
      - 'compose/local/docs/'
      - 'compose/production/django/'
    schedule:
      interval: 'weekly'
    # Solo parches de la imagen de Python: un salto de versión menor (3.14 a
    # 3.15) se hace a mano, junto con `requires-python`.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker-python:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directories:
      - 'compose/production/postgres/'
      - 'compose/production/traefik/'
      - 'compose/production/nginx/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
