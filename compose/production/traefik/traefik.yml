log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

  # Flower no tiene entrada pública (C-06): escucha en el 127.0.0.1:5555 del
  # servidor y se entra por túnel SSH (ver el README).

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'mititerspf2026@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

# El dominio no está decidido: sale de URBANCHECK_DOMAIN, que Compose le pasa
# al contenedor, y las reglas lo leen con la función `env` de las plantillas
# de Go del proveedor `file` (con las funciones de sprig). Ojo: Traefik
# interpreta la plantilla en todo el archivo, comentarios incluidos, así que
# acá no se pueden escribir llaves dobles fuera de una regla.
#
# Ruteo (C-04). Entre reglas del mismo dominio gana la más larga, que es la
# prioridad por defecto de Traefik:
#   panel.<dominio>        -> panel
#   <dominio> + /r/        -> panel (enlace para compartir, US-030; su nginx
#                             se lo pasa a Django)
#   <dominio> + /media/    -> nginx
#   <dominio>              -> django (API, admin y /.well-known/)
http:
  routers:
    web-secure-router:
      rule: 'Host(`{{ env "URBANCHECK_DOMAIN" }}`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt

    web-media-router:
      rule: 'Host(`{{ env "URBANCHECK_DOMAIN" }}`) && PathPrefix(`/media/`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django-media
      tls:
        certResolver: letsencrypt

    panel-router:
      rule: 'Host(`panel.{{ env "URBANCHECK_DOMAIN" }}`)'
      entryPoints:
        - web-secure
      middlewares:
        - panel-hsts
      service: panel
      tls:
        certResolver: letsencrypt

    # La página pública del reporte compartido (US-030). El enlace que arma
    # DJANGO_PUBLIC_REPORT_URL es <dominio>/r/{token}: el nginx del panel se lo
    # pasa a Django, que responde la vista previa para las redes y redirige a
    # DJANGO_PUBLIC_REPORT_PAGE_URL (panel.<dominio>/reporte/{token}).
    panel-share-router:
      rule: 'Host(`{{ env "URBANCHECK_DOMAIN" }}`) && PathPrefix(`/r/`)'
      entryPoints:
        - web-secure
      middlewares:
        - panel-hsts
      service: panel
      tls:
        certResolver: letsencrypt

  middlewares:
    # HSTS del panel (C-05). Django lo manda en sus propias respuestas; las del
    # panel las sirve su nginx, que no ve el TLS, así que lo agrega Traefik.
    # Un año, igual que Django. Para el primer despliegue conviene bajarlo
    # hasta verificar que todo anda por HTTPS: no se deshace en el navegador.
    panel-hsts:
      headers:
        stsSeconds: 31536000

    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

    panel:
      loadBalancer:
        servers:
          - url: http://panel:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
