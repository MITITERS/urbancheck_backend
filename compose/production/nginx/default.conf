server {
  listen       80;
  server_name  localhost;
  # Sin control de acceso: la foto de un reporte oculto o borrado sigue
  # accesible por su URL. Riesgo aceptado por el equipo (C-25); ver
  # "/media/ sin control de acceso" en el README.
  location /media/ {
    alias /usr/share/nginx/media/;
  }
}
